services:
  db:
    image: postgres:15
    container_name: capstone_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: admision_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: capstone_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@duoc.cl
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  backend:
    build: ../src/Backend
    container_name: capstone_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:root@db:5432/admision_db
      JWT_SECRET: ${JWT_SECRET:-cambia_esto_por_un_secreto_seguro}
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - db
    volumes:
      - ../src/Backend:/app
      - /app/node_modules

  frontend:
    build: ../src/Frontend
    container_name: capstone_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata: